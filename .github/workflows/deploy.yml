name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: haus-xataros

      - name: Build
        run: bun run build
        working-directory: haus-xataros

      - name: Copy 404
        run: bun run postbuild
        working-directory: haus-xataros

      - name: Verify asset paths
        run: bun run verify
        working-directory: haus-xataros

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: haus-xataros/dist
          force_orphan: true