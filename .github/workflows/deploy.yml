name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: haus-xataros/package-lock.json

      - name: Install dependencies
        working-directory: haus-xataros
        run: npm ci

      - name: Run tests
        working-directory: haus-xataros
        run: npm test

      - name: Build for GitHub Pages
        working-directory: haus-xataros
        run: VITE_BASE_PATH=/hausxataros/ npm run build

      - name: Copy 404
        working-directory: haus-xataros
        run: npm run postbuild

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: haus-xataros/dist
          force_orphan: true
