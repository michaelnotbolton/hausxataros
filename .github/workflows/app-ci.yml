name: App CI

on:
  push:
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/app-ci.yml"
      - "haus-xataros/**"
  pull_request:
    paths:
      - ".github/workflows/deploy.yml"
      - ".github/workflows/app-ci.yml"
      - "haus-xataros/**"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haus-xataros
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: haus-xataros/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify native bindings
        run: npm run verify:native-bindings

      - name: Verify generated E2E tests are in sync
        run: npm run test:e2e:check-generated

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e:run

      - name: Production build
        run: VITE_BASE_PATH=/hausxataros/ npm run build

      - name: Copy SPA fallback
        run: npm run postbuild

      - name: Storybook build
        run: npm run build-storybook

      - name: Storybook Pages build
        run: VITE_BASE_PATH=/hausxataros/ npm run build-storybook:pages

      - name: Docker build
        run: docker build -t haus-xataros:ci .
